version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foe_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foe_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-foe_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foe_admin} -d ${POSTGRES_DB:-foe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: foe_backend_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-foe_admin}:${POSTGRES_PASSWORD:-foe_secret_2026}@postgres:5432/${POSTGRES_DB:-foe_db}?schema=public
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-foe}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: foe_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata_prod:
